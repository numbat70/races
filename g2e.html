<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUP Races Homepage</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .top-section {
            background-color:  #000066;
            color: white;
            height: 30%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .clock-container {
            text-align: center;
        }
        .time {
            font-size: 2rem;
            margin: 0.5rem;
        }
        .date {
            font-size: 1rem;
            margin: 0.5rem;
        }
        .links-section {
            background-color: white;
            padding: 2rem 0;
            display: flex;
            align-items: flex-start; /* Align items at the top */
            justify-content: center;
            width: 100%;
            flex-direction: row; /* Arrange items side by side */
        }
        .column {
            width: 90%; /* Adjust column width */
            padding: 1rem;
            text-align: left;
        }
        .column h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .column a {
            color: royalblue;
            text-decoration: disc;
            font-size: 1.25rem;
            display: block;
            margin: 0.5rem 0;
        }
        .column a:hover {
            text-decoration: underline;
        }

        ul {
            margin: 0;
            list-style-type: disc;
            text-indent: -10px;
        }



    </style>
</head>
<body>
    <div class="top-section">
        <div class="clock-container">
            <div class="time" id="time"></div>
            <div class="date" id="date"></div>
        </div>
    </div>
    <div class="links-section">
        <div class="column" id="left-column">


            <h2>SUP Races</h2>
                <ul>
              
                    <li style="list-style: disc;"><a href="https://www.paddlescotland.org.uk/glasgow-to-edinburgh-challenge-11-12-october-2025" target="_blank"> Paddle Scotland: Glasgow to Edinburgh page</a></li>
                    <li style="list-style: disc;"><a href="https://maps.app.goo.gl/XK4ZRz361s8d45JDA" target="_blank"> Google map for Glasgow Start</a></li>                    
                    <li style="list-style: disc;"><a href="https://maps.app.goo.gl/usgnEqYr4GfmGwvPA" target="_blank"> Google Map for Falkirk Start</a></li>                    
                    <li style="list-style: disc;"><a href="https://maps.app.goo.gl/HQJns1UZiagxvJwa9" target="_blank"> Google Map for Falkirk Start Drop Off. Drive through the yard and towards the canal</a></li>                    
                    <li style="list-style: disc;"><a href="https://explore.osmaps.com/route/15899673/sca--glasgow-to-falkirk-wheel?lat=55.94444&lon=-4.15207&zoom=10.7299&overlays=os-ncn-layer&style=Aerial&type=2d" target="_blank">Glasgow to Falkirk OS Route MAP </a></li>                    
                    <li style="list-style: disc;"><a href="https://explore.osmaps.com/route/19035880/sca--falkirk-wheel-to-edinburgh?lat=55.96598&lon=-3.64845&zoom=10.2253&overlays=os-ncn-layer&style=Aerial&type=2d" target="_blank"> Falkirk to Edinburgh OS Route Map</a></li>                                         
                    <li style="list-style: disc;"><img src="G2Falkirk.png" alt="Description" style="width:50%; display:inline-block;"></li>
                    <li style="list-style: disc;"><img src="F2Edinburgh.png" alt="Description" style="width:50%; display:inline-block;"></li>                    
                 
                </ul> 
                </ul>   

        </div>
        <div class="column" id="right-column">
            
        

        </div>

<!--                 <li style="list-style: disc;"><a href="#" target="_blank"> </a></li>      -->

    </div>

    <script>
        function updateClock() {
            const now = new Date();

            // Format time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            // Format date
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const date = now.toLocaleDateString(undefined, options);

            // Update HTML elements
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById('date').textContent = date;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
